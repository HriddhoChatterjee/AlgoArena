<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoArena | Real-time Competitive Coding</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">ALGO<span class="accent">ARENA</span></a>
    <nav>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="#" id="nav-login">Login</a>
      <a href="#" id="nav-register" class="btn">Register</a>
    </nav>
  </header>

  <main class="container">
    <div style="text-align: center; margin-top: 4rem;">
      <h1>Enter the <span class="accent">Arena</span></h1>
      <p style="color: var(--text-secondary); max-width: 600px; margin: 1rem auto; font-size: 1.2rem;">
        The ultimate 1v1 competitive coding platform. Climb the ranks, represent your campus, and code under pressure.
      </p>
      <button class="btn btn-primary" style="font-size: 1.2rem; padding: 1rem 2rem; margin-top: 2rem;" onclick="document.getElementById('nav-register').click()">Start Playing Free</button>
    </div>
  </main>

  <dialog id="login-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2>Login</h2>
      <button class="btn" style="border: none; padding: 0;" onclick="document.getElementById('login-modal').close()">X</button>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <div id="login-error" style="color: var(--error); margin-bottom: 1rem; display: none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%">Authenticate</button>
    </form>
  </dialog>

  <dialog id="register-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2>Register</h2>
      <button class="btn" style="border: none; padding: 0;" onclick="document.getElementById('register-modal').close()">X</button>
    </div>
    <form id="register-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" required>
      </div>
      <div class="form-group">
        <label>College Campus (Optional)</label>
        <input type="text" id="reg-campus">
      </div>
      <div class="form-group">
        <label>Academic Section (Optional)</label>
        <input type="text" id="reg-section" placeholder="e.g. CS101">
      </div>
      <div id="register-error" style="color: var(--error); margin-bottom: 1rem; display: none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%">Create Profile</button>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
