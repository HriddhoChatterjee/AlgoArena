<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AlgoArena | Leaderboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .leaderboard-table th {
      color: var(--accent-primary);
      text-transform: uppercase;
      font-size: 0.9rem;
    }
    .leaderboard-table tr:hover {
      background: rgba(255,255,255,0.05);
    }
    .rank-cell { font-weight: bold; color: var(--accent-secondary); }
    .filters { display: flex; gap: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">ALGO<span class="accent">ARENA</span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <h2>Global <span class="accent">Leaderboard</span></h2>
    
    <div class="filters">
      <div class="form-group" style="flex: 1; margin: 0;">
        <input type="text" id="filter-campus" placeholder="Filter by Campus (e.g. MIT)">
      </div>
      <div class="form-group" style="flex: 1; margin: 0;">
        <input type="text" id="filter-section" placeholder="Filter by Section (e.g. CS101)">
      </div>
      <button class="btn btn-primary" id="btn-apply-filters">Apply Filters</button>
    </div>

    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Global Rank</th>
          <th>Username</th>
          <th>Elo Rating</th>
          <th>Campus Rank</th>
          <th>Section Rank</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <!-- Rendered via JS -->
      </tbody>
    </table>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchLeaderboard();
      document.getElementById('btn-apply-filters').addEventListener('click', fetchLeaderboard);
    });

    async function fetchLeaderboard() {
      const campus = document.getElementById('filter-campus').value.trim();
      const section = document.getElementById('filter-section').value.trim();
      
      let url = '/api/leaderboard';
      const params = new URLSearchParams();
      if (campus) params.append('campus', campus);
      if (section) params.append('section', section);
      
      if (params.toString()) {
        url += '?' + params.toString();
      }

      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';
      
      try {
        const data = await api.fetchJSON(url);
        tbody.innerHTML = '';
        if (data.length === 0) {
           tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No players found.</td></tr>';
           return;
        }
        data.forEach(player => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="rank-cell">#${player.global_rank}</td>
            <td>${player.username}</td>
            <td>${player.elo_rating}</td>
            <td>${player.campus_rank ? '#' + player.campus_rank : '-'}</td>
            <td>${player.section_rank ? '#' + player.section_rank : '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--error);">Error loading leaderboard</td></tr>`;
      }
    }
  </script>
</body>
</html>
